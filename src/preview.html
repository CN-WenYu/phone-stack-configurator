<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机支架 · 镂空配置</title>
<style>
:root { color-scheme:light dark; --font-size-base:16px; --foreground:light-dark(#1d2733,#eef3f9);
  --blue:light-dark(#407da8,#74add8); --orange:light-dark(#ac6743,#d09b77);
  font:1rem/1.5 system-ui,sans-serif; color:var(--foreground); background:Canvas; }
body { max-inline-size:850px; margin:auto; padding:1rem; }
.viz-controls,.viz-row { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
.form-check { display:inline-flex; align-items:center; gap:.25rem; }
.btn { font:inherit; border:1px solid color-mix(in srgb,currentColor 30%,transparent);
  border-radius:999px; padding:.25rem .75rem; background:Canvas; color:CanvasText; }
.btn-primary { background:CanvasText; color:Canvas; }
input { accent-color:var(--blue); }
.text-small { font-size:.875rem; }
.text-muted { color:color-mix(in srgb,var(--foreground) 75%,Canvas); }
.tabular-nums { font-variant-numeric:tabular-nums; }
p { margin:0; }
</style>
</head>
<body>
<section data-standalone id="stack-preview" lang="zh-Hans" aria-labelledby="stack-title">
  <h2 id="stack-title">轻量镂空手机支架</h2>
  <div class="viz-controls stack-controls">
    <fieldset>
      <legend>取机方向</legend>
      <div class="viz-row">
        <label class="form-check"><input class="form-check-input" type="radio" name="stack-direction" value="long" checked><span class="form-check-label">横向 · 长边</span></label>
        <label class="form-check"><input class="form-check-input" type="radio" name="stack-direction" value="short"><span class="form-check-label">侧向 · 短边</span></label>
      </div>
    </fieldset>
    <fieldset data-short-options hidden>
      <legend>侧向收纳</legend>
      <div class="viz-row">
        <label class="form-check"><input class="form-check-input" type="radio" name="stack-short-mode" value="full" checked><span class="form-check-label">全收纳</span></label>
        <label class="form-check"><input class="form-check-input" type="radio" name="stack-short-mode" value="overhang"><span class="form-check-label">外悬</span></label>
      </div>
    </fieldset>
  </div>
  <div class="viz-controls stack-controls">
    <fieldset>
      <legend>镂空样式</legend>
      <div class="viz-row">
        <label class="form-check"><input class="form-check-input" type="radio" name="stack-pattern" value="honeycomb" checked><span class="form-check-label">六边形蜂窝</span></label>
        <label class="form-check"><input class="form-check-input" type="radio" name="stack-pattern" value="diamond"><span class="form-check-label">菱形</span></label>
        <label class="form-check"><input class="form-check-input" type="radio" name="stack-pattern" value="triangle"><span class="form-check-label">三角形</span></label>
      </div>
    </fieldset>
    <div class="stack-density">
      <label for="stack-open-area">镂空率</label> <output for="stack-open-area" id="stack-open-value">50%</output>
      <input class="form-range" id="stack-open-area" type="range" min="35" max="60" step="5" value="50" aria-valuetext="50%">
    </div>
  </div>
  <form id="stack-size-form" class="viz-row stack-size" aria-label="单层外尺寸">
    <label class="form-label">长度（mm）<input class="form-control" name="length" type="number" inputmode="decimal" step="0.001" required></label>
    <label class="form-label">宽度（mm）<input class="form-control" name="width" type="number" inputmode="decimal" step="0.001" required></label>
    <label class="form-label">高度（mm，含卡扣）<input class="form-control" name="height" type="number" inputmode="decimal" step="0.001" min="20" max="80" required></label>
    <button class="btn btn-primary" type="button" data-size-apply>应用尺寸</button>
    <button class="btn" type="button" data-size-reset>恢复默认</button>
    <p id="stack-size-error" class="stack-size-error text-small text-destructive" role="alert" hidden></p>
  </form>
  <div class="viz-row stack-tools">
    <div class="viz-row" role="group" aria-label="观察角度">
      <button class="btn btn-primary" type="button" data-view="iso" aria-pressed="true">立体</button>
      <button class="btn" type="button" data-view="top" aria-pressed="false">俯视</button>
      <button class="btn" type="button" data-view="opening" aria-pressed="false">取机口</button>
    </div>
    <div class="viz-row">
      <label class="form-check"><input class="form-check-input" type="checkbox" data-phones checked><span class="form-check-label">显示手机</span></label>
      <label class="form-check"><input class="form-check-input" type="checkbox" data-cables><span class="form-check-label">显示充电线</span></label>
    </div>
  </div>
  <div class="stack-stage">
    <canvas role="img" aria-label="三层支架模型" aria-describedby="stack-dimensions">
      三层模型。顶部空层可见承托横梁和镂空区域。
    </canvas>
    <div class="stack-status" role="status">正在加载三维预览…</div>
  </div>
  <p id="stack-dimensions" class="tabular-nums" aria-live="polite"></p>
  <p id="stack-fit" class="text-small text-muted" aria-live="polite" hidden></p>
  <div class="viz-row" data-export hidden>
    <button class="btn btn-primary" type="button" data-save-stl>导出当前单层 STL</button>
  </div>
  <p class="text-small text-muted">拖动旋转 · 滚轮或双指缩放</p>

  #stack-preview { display:grid; gap:calc(var(--font-size-base) * .7); container-type:inline-size; }

  #stack-preview .stack-controls { align-items:start; gap:calc(var(--font-size-base) * 1.4); }
  #stack-preview .stack-density { flex:1 1 155px; min-width:0; max-width:240px; }
  #stack-preview .stack-density .form-range { display:block; width:100%; }

  @container (max-width:490px) {
